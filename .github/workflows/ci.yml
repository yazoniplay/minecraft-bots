name: CI

on:
  pull_request:
  push:
    branches: [main, foundation/mvp]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run check